<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logoApi.jpeg">

  <title>Prueba apis</title>



  <style>
    body {
      background: linear-gradient(135deg, #14213d, #1b263b 45%, #23334f);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Georgia', serif;
      color: #f3ebd9;
    }

    #container {
      width: min(90vw, 520px);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      align-items: center;
    }

    .buscador-onepiece {
      background-color: #f4e4bc;
      border: 4px solid #5c3a21;
      border-radius: 12px;
      padding: 12px 14px 14px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.45), inset 0 0 12px rgba(212, 184, 134, 0.9);
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
    }

    .search-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .search-field {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .buscar-label {
      display: block;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5c3a21;
      text-align: center;
      font-weight: bold;
    }

    /* Campo de texto */
    .buscador-onepiece input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 10px 15px;
      font-size: 16px;
      font-family: 'Georgia', serif;
      color: #3b2313;
      min-width: 0;
    }

    .buscador-onepiece input::placeholder {
      color: #8c6d53;
      font-style: italic;
    }

    .buscador-onepiece button {
      background-color: #c1121f;
      color: #ffd166;
      border: 2px solid #3b2313;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .buscador-onepiece button:hover {
      background-color: #ffd166;
      color: #c1121f;
      transform: scale(1.05);
    }


    .card-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      padding: 20px;
      width: 100%;
      box-sizing: border-box;
    }

    .card-container[hidden] {
      display: none;
    }

    .character-card {
      position: relative;
      box-sizing: border-box;
      width: 180px;
      min-height: 250px;
      padding: 34px 15px 16px;
      border: 3px solid #5c3a21;
      border-radius: 5px;
      text-align: center;
      color: #3b2313;
      font-weight: 600;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(255, 255, 255, 0.48), transparent 35%),
        linear-gradient(135deg, #f8e9c5, #e4c990);
      box-shadow: 0 7px 14px rgba(0, 0, 0, 0.35), inset 0 0 0 3px rgba(92, 58, 33, 0.14);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 0.5rem;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .character-card::before {
      content: attr(data-label);
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      padding: 3px 9px;
      border: 1px solid #7f1d1d;
      background: #a52a2a;
      color: #fff0c2;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      white-space: nowrap;
    }

    .character-card:hover {
      transform: translateY(-6px) rotate(-1deg);
      box-shadow: 0 13px 20px rgba(0, 0, 0, 0.42), inset 0 0 0 3px rgba(92, 58, 33, 0.14);
    }

    .character-card img {
      width: 100%;
      height: 110px;
      margin: 3px auto 4px;
      object-fit: cover;
      border: 2px solid #5c3a21;
      border-radius: 3px;
      background: #d4b886;
    }

    .character-card h3 {
      margin: 0 0 0.2rem;
      padding-bottom: 0.45rem;
      border-bottom: 1px dashed #8c6d53;
      color: #5c1f1f;
      font-size: 1rem;
      line-height: 1.3;
    }

    .character-card p {
      margin: 0;
      color: #4b3828;
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .site-footer {
      position: relative;
      background-color: #1a1614;
      color: #8c827c;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.875rem;
      padding: 2.5rem 2rem 4rem 2rem;
      overflow: hidden;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
      box-sizing: border-box;
      margin-top: 2rem;
    }

    .footer-content {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-disclaimer {
      margin: 0;
      color: #a3968e;
    }

    .footer-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #22c55e;
      /* Verde brillante */
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
    }

    .version {
      color: #a3968e;
    }

    .separator {
      color: #594f49;
    }

    .license {
      color: #a3968e;
    }

    .footer-watermark {
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9.5rem;
      font-weight: 900;
      font-family: serif;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.04);
      white-space: nowrap;
      z-index: 1;
      user-select: none;
      pointer-events: none;
      letter-spacing: 0.05em;
    }

    @media (max-width: 768px) {
      .site-footer {
        padding: 2rem 1rem 3rem 1rem;
      }

      .footer-content {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-watermark {
        font-size: 5rem;
        bottom: 5px;
      }
    }
  </style>

</head>

<body class="body">

  <div id="container">
    <form class="buscador-onepiece">
      <div class="search-wrap">
        <label class="buscar-label" for="buscar-input">Buscar</label>

        <div class="filter-field">
          <select id="categoria-select" name="categoria" aria-label="Seleccionar categoría">
            <option value="personajes">Personajes</option>
            <option value="sagas">Sagas</option>
            <option value="frutas">Frutas del Diablo</option>
            <option value="tripulaciones">Tripulaciones</option>
          </select>
        </div>

        <div class="search-field">
          <input type="search" id="buscar-input" name="q" placeholder="Escribe aquí..." required>
          <button type="submit">Buscar</button>
        </div>
      </div>
    </form>

    <div id="card-personajes" class="card-container"></div>
    <div id="card-frutas" class="card-container" hidden></div>
    <div id="card-sagas" class="card-container" hidden></div>
    <div id="card-tripulaciones" class="card-container" hidden></div>
  </div>

  <footer class="site-footer">
    <div class="footer-content">
      <p class="footer-disclaimer">
        One Piece is the work of Eiichiro Oda. Data and images are used without claiming ownership.
      </p>
      <div class="footer-meta">
        <span class="status-dot"></span>
        <span class="version">v1.0</span>
        <span class="separator">|</span>
        <span class="license">Uso educativo</span>
      </div>
    </div>
    <div class="footer-watermark">ONE PIECE</div>
  </footer>

  <script>
    const API_URLS = {
      personajes: 'https://api.api-onepiece.com/v2/characters/en',
      frutas: 'https://api.api-onepiece.com/v2/fruits/en',
      sagas: 'https://api.api-onepiece.com/v2/sagas/en',
      tripulaciones: 'https://api.api-onepiece.com/v2/crews/en'
    };

    const form = document.querySelector('.buscador-onepiece');
    const categoriaSelect = document.getElementById('categoria-select');
    const buscarInput = document.getElementById('buscar-input');
    const contenedores = {
      personajes: document.getElementById('card-personajes'),
      frutas: document.getElementById('card-frutas'),
      sagas: document.getElementById('card-sagas'),
      tripulaciones: document.getElementById('card-tripulaciones')
    };
    const datosPorCategoria = {};

    function agregarDato(tarjeta, etiqueta, valor) {
      const dato = document.createElement('p');
      dato.textContent = `${etiqueta}: ${valor ?? 'No disponible'}`;
      tarjeta.appendChild(dato);
    }

    function crearTarjeta(categoria, item) {
      const tarjeta = document.createElement('article');
      tarjeta.className = 'character-card';

      const titulo = document.createElement('h3');

      if (categoria === 'personajes') {
        tarjeta.dataset.label = 'SE BUSCA';
        titulo.textContent = item.name || 'Sin nombre';
        tarjeta.appendChild(titulo);
        agregarDato(tarjeta, 'Recompensa', item.bounty);
        agregarDato(tarjeta, 'Edad', item.age);
        agregarDato(tarjeta, 'Tamaño', item.size);
        agregarDato(tarjeta, 'Tripulación', item.crew?.name);
        agregarDato(tarjeta, 'Fruta', item.fruit?.name);
        agregarDato(tarjeta, 'Cargo', item.job);
        agregarDato(tarjeta, 'Estado', item.status);
      } else if (categoria === 'frutas') {
        tarjeta.dataset.label = 'FRUTA DEL DIABLO';
        titulo.textContent = item.name || 'Fruta sin nombre';

        if (item.filename) {
          const imagen = document.createElement('img');
          imagen.src = item.filename;
          imagen.alt = item.name ? `Imagen de ${item.name}` : 'Imagen de fruta';
          imagen.loading = 'lazy';
          imagen.addEventListener('error', () => imagen.remove());
          tarjeta.appendChild(imagen);
        }

        tarjeta.appendChild(titulo);
        agregarDato(tarjeta, 'Nombre original', item.roman_name);
        agregarDato(tarjeta, 'Tipo', item.type);

        if (item.description) {
          agregarDato(tarjeta, 'Descripción', item.description);
        }
      } else if (categoria === 'sagas') {
        tarjeta.dataset.label = 'SAGA';
        titulo.textContent = item.title || 'Saga sin título';
        tarjeta.appendChild(titulo);
        agregarDato(tarjeta, 'Número', item.saga_number);
        agregarDato(tarjeta, 'Capítulos', item.saga_chapitre);
        agregarDato(tarjeta, 'Volúmenes', item.saga_volume);
        agregarDato(tarjeta, 'Episodios', item.saga_episode);
      } else {
        tarjeta.dataset.label = 'TRIPULACIÓN';
        titulo.textContent = item.name || 'Tripulación sin nombre';
        tarjeta.appendChild(titulo);
        agregarDato(tarjeta, 'Nombre original', item.roman_name);
        agregarDato(tarjeta, 'Estado', item.status);
        agregarDato(tarjeta, 'Recompensa total', item.total_prime);
        agregarDato(tarjeta, 'Miembros registrados', item.number);
        agregarDato(tarjeta, 'Yonko', item.is_yonko ? 'Sí' : 'No');

        const miembros = (datosPorCategoria.personajes || [])
          .filter((personaje) => String(personaje.crew?.id) === String(item.id))
          .map((personaje) => personaje.name)
          .filter(Boolean);
        agregarDato(tarjeta, `Adeptos (${miembros.length})`, miembros.join(', ') || 'No disponibles');
      }

      return tarjeta;
    }

    function mostrarItems(categoria) {
      const contenedor = contenedores[categoria];
      const termino = buscarInput.value.trim().toLocaleLowerCase();
      const items = (datosPorCategoria[categoria] || []).filter((item) => {
        let texto;
        if (categoria === 'sagas') {
          texto = `${item.title || ''} ${item.saga_number || ''}`;
        } else if (categoria === 'tripulaciones') {
          const miembros = (datosPorCategoria.personajes || [])
            .filter((personaje) => String(personaje.crew?.id) === String(item.id))
            .map((personaje) => personaje.name || '');
          texto = `${item.name || ''} ${item.roman_name || ''} ${miembros.join(' ')}`;
        } else {
          texto = `${item.name || ''} ${item.roman_name || ''}`;
        }
        return texto.toLocaleLowerCase().includes(termino);
      });

      contenedor.replaceChildren();

      if (items.length === 0) {
        contenedor.textContent = 'No se encontraron resultados.';
        return;
      }

      items.forEach((item) => {
        contenedor.appendChild(crearTarjeta(categoria, item));
      });
    }

    async function cargarCategoria(categoria) {
      const contenedor = contenedores[categoria];

      Object.entries(contenedores).forEach(([nombre, elemento]) => {
        elemento.hidden = nombre !== categoria;
      });

      if (datosPorCategoria[categoria]) {
        mostrarItems(categoria);
        return;
      }

      contenedor.textContent = 'Cargando...';

      try {
        const respuesta = await fetch(API_URLS[categoria]);
        if (!respuesta.ok) {
          throw new Error(`La API respondió con estado ${respuesta.status}`);
        }

        const datos = await respuesta.json();
        if (!Array.isArray(datos)) {
          throw new Error('La respuesta de la API no tiene el formato esperado.');
        }

        if (categoria === 'tripulaciones' && !datosPorCategoria.personajes) {
          const respuestaPersonajes = await fetch(API_URLS.personajes);
          if (!respuestaPersonajes.ok) {
            throw new Error(`La API de personajes respondió con estado ${respuestaPersonajes.status}`);
          }

          const personajes = await respuestaPersonajes.json();
          if (!Array.isArray(personajes)) {
            throw new Error('La respuesta de personajes no tiene el formato esperado.');
          }

          datosPorCategoria.personajes = personajes;
        }

        datosPorCategoria[categoria] = datos;
        if (categoriaSelect.value === categoria) {
          mostrarItems(categoria);
        }
      } catch (error) {
        console.error(`Error al cargar ${categoria}:`, error);
        contenedor.textContent = 'No se pudieron cargar los datos. Intenta nuevamente.';
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      mostrarItems(categoriaSelect.value);
    });

    categoriaSelect.addEventListener('change', () => {
      cargarCategoria(categoriaSelect.value);
    });

    cargarCategoria(categoriaSelect.value);
  </script>

</body>

</html>
